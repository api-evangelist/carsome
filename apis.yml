description: Carsome is Southeast Asia's largest integrated used-car e-commerce platform,
  founded in 2015 and headquartered in Kuala Lumpur, Malaysia, with operations across
  Malaysia, Indonesia, Thailand, and Singapore. The company runs an online marketplace
  where consumers can sell, buy, and finance pre-owned vehicles, combining a consumer-facing
  storefront with B2B dealer auctions, vehicle inspection and certification, logistics,
  insurance, and financing services. Carsome is a venture-backed technology company
  (a regional unicorn) counted among the portfolio of 500 Global. No public developer
  program, API documentation, or API surface has been found; this profile remains a
  company/lead record awaiting any published API.
